  <rect x="48" y="96" width="420" height="34" fill="#111111"/>
  <text x="62" y="119" font-family="Courier New, Menlo, monospace" font-weight="700" font-size="16" letter-spacing="2" textLength="380" lengthAdjust="spacingAndGlyphs" fill="#c6f432">FULL-STACK · DEVOPS · GAME DEV</text>

  <!-- titre -->
  <text x="48" y="212" font-family="Arial Black, Helvetica Neue, Arial, sans-serif" font-weight="900" font-size="72" letter-spacing="-2" textLength="540" lengthAdjust="spacingAndGlyphs" fill="#111111">Hi, I'm Thibault.</text>

  <!-- encart lime avec ombre dure -->
  <g transform="rotate(-1.2 60 300)">
    <rect x="62" y="270" width="720" height="92" fill="#111111"/>
    <rect x="48" y="256" width="720" height="92" fill="#c6f432" stroke="#111111" stroke-width="4"/>
    <text x="72" y="318" font-family="Arial Black, Helvetica Neue, Arial, sans-serif" font-weight="900" font-size="42" letter-spacing="-1" textLength="660" lengthAdjust="spacingAndGlyphs" fill="#111111">Sites that run. Servers that hold.</text>
  </g>

  <text x="48" y="392" font-family="Courier New, Menlo, monospace" font-weight="700" font-size="16" textLength="510" lengthAdjust="spacingAndGlyphs" fill="#111111">by Thibault Pouch · aka Pandorian · student @ Epitech</text>

