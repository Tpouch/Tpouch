<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="DevGoblin banner: Hi, I'm Thibault. I build sites that run and servers that hold." xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#111111" stroke-opacity=".08" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1200" height="420" fill="#f4efe3"/>
  <rect width="1200" height="420" fill="url(#grid)"/>
  <rect x="2" y="2" width="1196" height="416" fill="none" stroke="#111111" stroke-width="4"/>

  <!-- barre du haut -->
  <rect x="2" y="2" width="1196" height="64" fill="#c6f432" stroke="#111111" stroke-width="4"/>
